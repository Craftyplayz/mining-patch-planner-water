name: Build mod

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Package mod
        id: package
        run: |
          name=$(jq -r .name info.json)
          version=$(jq -r .version info.json)
          folder="${name}_${version}"
          mkdir -p "build/$folder"
          rsync -a --exclude='.git*' --exclude='.github' --exclude='build' ./ "build/$folder/"
          (cd build && zip -qr "$folder.zip" "$folder")
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "build/${{ steps.package.outputs.folder }}.zip" \
            --title "Latest build (${{ steps.package.outputs.folder }})" \
            --notes "Built automatically from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --prerelease
